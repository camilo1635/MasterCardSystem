spring:
  application:
    name: mastercard-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mastercard}
    username: ${DB_USER:mastercard}
    password: ${DB_PASSWORD:mastercard}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  jwt:
    # Obligatorio (mín. 32 bytes / 256 bits). Sin valor por defecto: en dev lo da application-dev.yml.
    secret: ${JWT_SECRET:}
    access-minutes: 30
    refresh-hours: 8
  cookie:
    # En producción (https) debe ser true; en dev (http) se pone false.
    secure: ${COOKIE_SECURE:true}
    name: refresh_token
  security:
    max-failed-attempts: 5
    lock-minutes: 15
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

# Swagger apagado salvo en el perfil dev.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
